name: Build & Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dockerts/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.29"
          enable-cache: true
          cache-dependency-glob: dockerts/backend/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint check (Ruff)
        run: uv run ruff check .

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Type check (Mypy)
        run: uv run mypy src

      - name: Run unit tests (Pytest)
        run: uv run pytest -q

  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dockerts/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dockerts/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://localhost:8000

      - name: Test
        run: npm test

  docker-compose:
    name: Docker Compose (Build & Smoke Test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: dockerts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start stack with Docker Compose
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'; then
              echo "Backend is healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to report healthy status in time" >&2
          exit 1

      - name: Wait for frontend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              echo "Frontend is healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to respond in time" >&2
          exit 1

      - name: Run API idempotency smoke test
        run: |
          set -euo pipefail
          KEY="ci-test-$(date +%s)-$RANDOM"
          BODY='{
            "full_name": "Test User",
            "email": "test@example.com",
            "phone": "+1234567890",
            "date_of_birth": "1995-01-01",
            "sex": "male",
            "height_cm": 175.0,
            "weight_kg": 70.0,
            "blood_type": "A+",
            "country": "US"
          }'

          post() {
            curl -sS -o "$1" -w '%{http_code}' \
              -X POST http://localhost:8000/api/v1/bio-records \
              -H 'Content-Type: application/json' \
              -H "Idempotency-Key: $KEY" \
              -d "$BODY"
          }

          CODE1=$(post /tmp/r1.json)
          CODE2=$(post /tmp/r2.json)

          echo "First POST status:  $CODE1"
          echo "Second POST status: $CODE2"

          if [ "$CODE1" != "201" ]; then
            echo "FAIL: Expected 201 on first POST, got $CODE1" >&2
            cat /tmp/r1.json
            exit 1
          fi

          if [ "$CODE2" != "200" ]; then
            echo "FAIL: Expected 200 on replay POST, got $CODE2" >&2
            cat /tmp/r2.json
            exit 1
          fi

          ID1=$(jq -r '.id' /tmp/r1.json)
          ID2=$(jq -r '.id' /tmp/r2.json)
          if [ "$ID1" != "$ID2" ]; then
            echo "FAIL: Replay returned different ID ($ID1 != $ID2)" >&2
            exit 1
          fi
          echo "SUCCESS: Docker Compose stack up and API idempotency test passed!"

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=400

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v --remove-orphans